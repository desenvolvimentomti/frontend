<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MTI</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="auth-wrapper">
        
        <div class="auth-form-side">
            <div class="auth-content">
                <div class="brand-logo">
                    <span class="material-symbols-outlined logo-icon"></span>
                    <span>Minas Tecnologia e Inovação</span>
                </div>

                <div class="auth-header">
                    <h1>Bem-vindo de volta</h1>
                    <p>Insira suas credenciais para acessar o painel.</p>
                </div>

                {% if error %}
                <div class="alert-box error" style="margin-bottom: 20px;">
                    <span class="material-symbols-outlined" style="font-size: 1.2rem;">error</span>
                    {{ error }}
                </div>
                {% endif %}

                <form action="/login" method="post">
                    <div class="input-group-modern">
                        <label for="email">E-mail Corporativo</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">mail</span>
                            <input type="email" id="email" name="email" placeholder="nome@mti.com" required>
                        </div>
                    </div>
                    
                    <div class="input-group-modern">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">lock</span>
                            <input type="password" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-auth">
                        Acessar Sistema <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Ainda não tem acesso? <a href="/register">Solicitar conta</a></p>
                </div>
            </div>
        </div>

        <div class="auth-visual-side">
            <div class="visual-content">
                <h2>Inteligência de Mercado</h2>
                <p>Acesse dados estratégicos.</p>
            </div>
            <div class="circle c1"></div>
            <div class="circle c2"></div>
        </div>

    </div>

</body>
</html>
