<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - MTI</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <div class="auth-wrapper">
        
        <div class="auth-form-side">
            <div class="auth-content">
                <div class="brand-logo">
                    <span class="material-symbols-outlined logo-icon" style="color: var(--accent);">rocket_launch</span>
                    <span style="color: var(--primary);">Minas Tecnologia e Inovação</span>
                </div>

                <div class="auth-header">
                    <h1>Criar nova conta</h1>
                    <p>Preencha os dados abaixo para se registrar.</p>
                </div>

                {% if error %}
                <div class="alert-box error" style="margin-bottom: 20px;">
                    <span class="material-symbols-outlined" style="font-size: 1.2rem;">error</span>
                    {{ error }}
                </div>
                {% endif %}

                <form action="/register" method="post">
                    <div class="input-group-modern">
                        <label>E-mail Corporativo</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">mail</span>
                            <input type="email" name="email" placeholder="seu.nome@mti.com" required>
                        </div>
                        <small>Deve terminar com @mti.com</small>
                    </div>
                    
                    <div class="input-group-modern">
                        <label>Senha Segura</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined input-icon">key</span>
                            <input type="password" name="password" placeholder="Mínimo 4 caracteres" required minlength="4">
                        </div>
                    </div>

                    <button type="submit" class="btn-auth">
                        Criar Conta <span class="material-symbols-outlined">person_add</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Já possui acesso? <a href="/login">Fazer Login</a></p>
                </div>
            </div>
        </div>

        <div class="auth-visual-side register-bg">
            <div class="visual-content">
                <h2>MINAS TECNOLOGIA E INOVAÇÃO</h2>
                <p>Cadastre, monitore e analise startups.</p>
            </div>
            <div class="circle c1"></div>
            <div class="circle c2"></div>
        </div>

    </div>

</body>
</html>
